<title>Liftgram 화면 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에서 판정(고아), 가운데 왼쪽에 지도·오른쪽에 선택한 화면, 아래에 전체 목록 */
:root{--bg:#F7F7F7;--card:#FFFFFF;--alt:#F1F2F4;--line:#DBDBDB;--ink:#141619;--ink2:#3E4348;--ink3:#6A737B;--brand:#C8381C;--brandbg:#FFF0EB;--in:#0B6E8F;--inbg:#E3F3F8;--warn:#9A5B00;--warnbg:#FFF3DC;--dead:#8A9098;--edge:#B9BEC4;
--sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#2B2B2B;--alt:#3A3A3A;--line:#424242;--ink:#F5F7F9;--ink2:#D8DBDF;--ink3:#98A1AD;--brand:#FF7A57;--brandbg:#3D2620;--in:#62C5E3;--inbg:#17333D;--warn:#F2B661;--warnbg:#3A2C14;--dead:#7D848C;--edge:#565B61;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--card:#2B2B2B;--alt:#3A3A3A;--line:#424242;--ink:#F5F7F9;--ink2:#D8DBDF;--ink3:#98A1AD;--brand:#FF7A57;--brandbg:#3D2620;--in:#62C5E3;--inbg:#17333D;--warn:#F2B661;--warnbg:#3A2C14;--dead:#7D848C;--edge:#565B61;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans)}
.wrap{max-width:1500px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
h1{font-size:30px;line-height:1.25;margin:0;text-wrap:balance}h2{font-size:20px;margin:0;text-wrap:balance}h3{font-size:15px;margin:0}
p{margin:0;max-width:72ch}.lead{color:var(--ink2);margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px;font-variant-numeric:tabular-nums;color:var(--ink2)}.stats b{color:var(--ink);font-size:18px;margin-right:4px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.orph{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ob{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ob.hot{border-color:var(--warn);background:var(--warnbg)}
.ob small{color:var(--ink2);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12.5px/1.3 var(--mono);padding:4px 8px;border-radius:6px;background:var(--alt);color:var(--ink);border:0;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
.tag.k{font-family:var(--sans)}.tag:hover{background:var(--brandbg)}
.odd{display:grid;grid-template-columns:minmax(0,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.odd>div{padding:10px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(160px,240px) minmax(0,1fr);gap:4px 16px}.odd>div:first-child{border-top:0}
.odd b{font-weight:500}.odd span{color:var(--ink2)}.odd em{font-style:normal;font-size:12px;color:var(--warn)}
@media(max-width:640px){.odd>div{grid-template-columns:minmax(0,1fr)}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px/1 var(--sans);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.tag:focus-visible,.nd:focus-visible,tr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sp{flex:1 1 auto}
.graph{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;height:min(78vh,860px);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}.legend i{display:inline-block;width:18px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line);background:var(--card)}
svg text{font-family:var(--sans)}
.nd{cursor:pointer}.nd rect.b{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.nd .t{fill:var(--ink);font-size:13px;font-weight:500}.nd .u{fill:var(--ink3);font:400 10.5px var(--mono)}
.nd.tab rect.b{fill:var(--brand);stroke:var(--brand)}.nd.tab .t{fill:var(--card);font-weight:700}.nd.tab .u{fill:var(--card);opacity:.85}
.nd.sheet rect.b,.nd.system rect.b{stroke-dasharray:4 3;fill:var(--alt)}
.nd.native rect.b{stroke:var(--in);stroke-width:1.6}
.nd.entry rect.b,.nd.global rect.b{fill:var(--alt);stroke:transparent}
.nd.redirect rect.b{stroke-dasharray:1 3;stroke-width:1.6}
.nd.dead rect.b{fill:transparent;stroke:var(--dead);stroke-dasharray:2 3}.nd.dead .t{fill:var(--dead);text-decoration:line-through}
.nd.orphan rect.b{stroke:var(--warn);stroke-width:2;fill:var(--warnbg)}
.nd.sel rect.b{stroke:var(--ink);stroke-width:2.4}
.g.has .nd:not(.on) text{opacity:.32}.g.has .nd:not(.on) rect.b{stroke:var(--line)}.g.has .nd.tab:not(.on) rect.b{fill:var(--alt)}.g.has .nd.tab:not(.on) text{fill:var(--ink)}
path.e{fill:none;stroke:var(--edge);stroke-width:1;opacity:.55}
path.e.back{stroke-dasharray:3 4}path.e.redir{stroke-dasharray:6 3}path.e.open{stroke-dasharray:2 3}
.g.has path.e{opacity:.1}
.g.has path.e.i{stroke:var(--in);stroke-width:2;opacity:1}.g.has path.e.o{stroke:var(--brand);stroke-width:2;opacity:1}
.lb rect{fill:var(--card)}.lb text{font-size:11px;fill:var(--ink)}
.colt{font-size:12px;fill:var(--ink3);font-weight:500}
.lane{fill:var(--warnbg);opacity:.55}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;min-width:0}
@media(max-width:1020px){.panel{position:static;max-height:none}}
.panel .url{font:500 13px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--alt);color:var(--ink2)}.pill.w{background:var(--warnbg);color:var(--warn)}
.kv{font-size:13.5px;color:var(--ink2)}
.path{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.path li button{all:unset;display:block;box-sizing:border-box;width:100%;cursor:pointer;padding:8px 10px;border-radius:8px;background:var(--alt)}
.path li button:hover{background:var(--brandbg)}.path li button:focus-visible{outline:2px solid var(--brand)}
.path .a{font-size:13.5px;font-weight:500}.path .a b{font-weight:500;color:var(--ink3)}.path .why{display:block;font-size:13px;color:var(--ink2)}.path .ev{display:block;font:400 10.5px var(--mono);color:var(--ink3);overflow-wrap:anywhere;margin-top:2px}
h3.in{color:var(--in)}h3.out{color:var(--brand)}
.empty{font-size:13px;color:var(--ink3)}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:640px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13.5px}th{position:sticky;top:0;background:var(--alt);text-align:left;font-weight:500;padding:9px 12px;white-space:nowrap}td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:var(--brandbg)}td.m{font:400 12px var(--mono);color:var(--ink2);overflow-wrap:anywhere}td.n{font-variant-numeric:tabular-nums;text-align:right}
input[type=search]{font:400 14px var(--sans);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:36px;width:min(260px,100%)}
.foot{font-size:13px;color:var(--ink3)}
.gal{display:flex;flex-direction:column;gap:18px}.gal h3{color:var(--ink2)}.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:8px}
.gc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.gc:hover{border-color:var(--brand)}.gc:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gc img{display:block;width:100%;aspect-ratio:390/700;object-fit:cover;object-position:top;background:var(--alt)}.gc span{font-size:12.5px;line-height:1.35;padding:6px 8px;overflow-wrap:anywhere}
.shotb{all:unset;display:block;flex:none;cursor:zoom-in;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:560px}.shotb:focus-visible{outline:2px solid var(--brand)}.shotb img{display:block;width:100%}.noshot{font-size:13px;color:var(--warn);background:var(--warnbg);padding:8px 10px;border-radius:8px}
dialog#lb{padding:0;border:0;background:transparent;max-width:min(430px,94vw);max-height:94vh;overflow:auto}dialog#lb::backdrop{background:rgba(0,0,0,.72)}dialog#lb img{display:block;width:100%}
td img.th{display:block;width:44px;height:78px;object-fit:cover;object-position:top;border-radius:4px;border:1px solid var(--line)}
</style>
<div class="wrap">
<header>
<h1>Liftgram 화면 지도</h1>
<p class="lead">앱에서 볼 수 있는 화면 전부와, 어떤 버튼으로 어디로 가는지를 코드에서 뽑았습니다. 화면을 누르면 들어오는 길과 나가는 길이 화살표로 표시됩니다.</p>
<div class="stats" id="stats"></div>
</header>
<section><h2>들어오는 길이 없는 화면</h2><div class="orph" id="orph"></div></section>
<section><h2>길이 이상한 곳</h2><div class="odd" id="odd"></div></section>
<section><h2>화면 캡처</h2><p class="lead" id="galn"></p><div class="ctrl" id="gk"></div><div class="gal" id="gal"></div><details id="nos"><summary style="cursor:pointer;font-weight:500"></summary><div class="odd" id="nosl" style="margin-top:8px"></div></details></section>
<section><h2>화면 연결 지도</h2>
<div class="ctrl" id="ctrl">
<button class="chip" data-m="pages" aria-pressed="true">주소 있는 화면</button>
<button class="chip" data-m="sheets" aria-pressed="false">시트·대화상자까지</button>
<button class="chip" data-m="all" aria-pressed="false">앱 전용·도달 불가까지</button>
<button class="chip" id="bk" aria-pressed="false">뒤로 가기 표시</button>
<span class="sp"></span>
<button class="chip" id="zo" aria-label="축소">−</button><button class="chip" id="zi" aria-label="확대">+</button>
<input type="search" id="q2" placeholder="화면 찾기" aria-label="지도에서 화면 찾기" list="dl"><datalist id="dl"></datalist>
</div>
<div class="legend"><span><i style="background:var(--brand);border-color:var(--brand)"></i>탭</span><span><i></i>주소 있는 화면</span><span><i style="border-style:dashed;background:var(--alt)"></i>시트·시스템 상태</span><span><i style="border-color:var(--in)"></i>앱 전용</span><span><i style="background:var(--alt);border-color:transparent"></i>앱 밖·전역 입구</span><span><i style="border-color:var(--warn);background:var(--warnbg)"></i>들어오는 길 없음</span><span><i style="border-color:var(--in);background:var(--inbg)"></i>파란 선: 들어오는 길</span><span><i style="border-color:var(--brand);background:var(--brandbg)"></i>빨간 선: 나가는 길</span></div>
<div class="main">
<div class="graph" id="gw" tabindex="0" aria-label="화면 연결 지도. 가로세로로 스크롤합니다"></div>
<aside class="panel" id="panel" aria-live="polite"></aside>
</div></section>
<section><h2>전체 화면 목록</h2>
<div class="ctrl" id="fk"></div>
<div class="ctrl"><input type="search" id="q" placeholder="이름·주소·설명 검색" aria-label="목록 검색"><span id="cnt" class="foot"></span></div>
<div class="tw"><table><thead><tr><th>캡처</th><th>화면</th><th>주소</th><th>종류</th><th>설명</th><th>접근 조건</th><th>들어옴</th><th>나감</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
<dialog id="lb" aria-label="화면 크게 보기"><img alt=""></dialog>
<p class="foot" id="foot"></p>
</div>
<script>

function row(e,dir){const o=dir==='in'?byId[e.a]:byId[e.b];return`<li><button data-go="${esc(o.id)}"><span class="a">${esc(o.name)} ${o.url?`<b>${esc(o.url)}</b>`:''}</span><span class="why">${esc(TL[e.t])}: ${esc(e.label)}</span>${e.ev?`<span class="ev">${esc(e.ev)}</span>`:''}</button></li>`}
function panel(){if(!sel){document.getElementById('panel').innerHTML=`<h2>화면을 눌러 보세요</h2><p class="kv">지도의 화면을 누르면 어떤 버튼으로 들어오고 나가는지 여기에 나옵니다. 지도에서는 파란 선이 들어오는 길, 빨간 선이 나가는 길입니다.</p><p class="kv">왼쪽 노란 줄이 들어오는 길이 없는 화면입니다. 빈 곳을 누르면 선택이 풀립니다.</p>`;return}const n=byId[sel];const ins=IN[sel].filter(e=>e.t!=='back'),outs=OUT[sel].filter(e=>e.t!=='back'),bk=OUT[sel].filter(e=>e.t==='back');
 const sheet=outs.filter(e=>e.t==='open'),go=outs.filter(e=>e.t!=='open');
 document.getElementById('panel').innerHTML=`<div><span class="pill">${KL[n.kind]}</span>${orphan.has(n.id)?' <span class="pill w">들어오는 길 없음</span>':''}<h2 style="margin-top:8px">${esc(n.name)}</h2>${n.url?`<div class="url">${esc(n.url)}</div>`:''}</div>
 ${n.shot?`<button class="shotb" data-shot="${esc(n.shot)}" aria-label="${esc(n.name)} 크게 보기"><img src="${esc(n.shot)}" alt="${esc(n.name)} 화면 캡처"></button>`:n.noshot?`<p class="noshot">캡처 없음: ${esc(n.noshot)}</p>`:''}${n.note?`<p class="kv">${esc(n.note)}</p>`:''}${n.desc?`<p class="kv">${esc(n.desc)}</p>`:''}${n.cond?`<p class="kv"><b>조건</b> ${esc(n.cond)}</p>`:''}${n.ev?`<p class="kv" style="font:400 11px var(--mono);overflow-wrap:anywhere">${esc(n.ev)}</p>`:''}
 <h3 class="in">들어오는 길 ${ins.length}</h3>${ins.length?`<ul class="path">${ins.map(e=>row(e,'in')).join('')}</ul>`:`<p class="empty">${n.url?'앱 안에도 앱 밖에도 입구가 없습니다. 주소 입력으로만 열립니다.':'연결된 입구가 없습니다.'}</p>`}
 <h3 class="out">나가는 길 ${go.length}</h3>${go.length?`<ul class="path">${go.map(e=>row(e,'out')).join('')}</ul>`:`<p class="empty">이 화면에서 다른 화면으로 가는 버튼이 없습니다${n.kind==='page'?'. 하단 탭바로만 나갑니다':''}.</p>`}
 ${sheet.length?`<h3 class="out">이 화면에서 뜨는 시트 ${sheet.length}</h3><ul class="path">${sheet.map(e=>row(e,'out')).join('')}</ul>`:''}
 ${bk.length?`<h3>뒤로 가기</h3><ul class="path">${bk.map(e=>row(e,'out')).join('')}</ul>`:''}`;
 document.querySelectorAll('#panel [data-go]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.go)))}
function pick(id,scroll){sel=id;const n=byId[id];
 if(n.kind==='sheet'||n.kind==='system'){if(mode==='pages'){mode='sheets'}}
 if(n.kind==='native'||n.kind==='dead')mode='all';
 document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
 draw();if(scroll!==false)center(id)}
function center(id){const p=cur.L.pos[id],gw=document.getElementById('gw');if(!p)return;gw.scrollTo({left:p.x*zoom-gw.clientWidth/2+W*zoom/2,top:p.y*zoom-gw.clientHeight/2,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));
document.getElementById('bk').addEventListener('click',e=>{showBack=!showBack;e.currentTarget.setAttribute('aria-pressed',showBack);draw()});
document.getElementById('zi').addEventListener('click',()=>{zoom=Math.min(1.3,zoom+.15);draw()});document.getElementById('zo').addEventListener('click',()=>{zoom=Math.max(.4,zoom-.15);draw()});
document.getElementById('q2').addEventListener('change',e=>{const v=e.target.value.trim();const n=N.find(x=>x.kind!=='raw'&&(x.url===v||x.name===v))||N.find(x=>x.kind!=='raw'&&(x.name+(x.url||'')).includes(v));if(n){pick(n.id);document.getElementById('gw').scrollIntoView({block:'nearest'})}});
document.addEventListener('click',e=>{const t=e.target.closest('.tag[data-go]');if(t){pick(t.dataset.go);document.getElementById('gw').scrollIntoView({block:'center'})}});
// ── 목록
let fk='전체';const FK=[['전체',null],['주소 있는 화면',['tab','page','redirect']],['시트·대화상자',['sheet']],['시스템 상태',['system']],['앱 전용',['native']],['앱 밖 입구',['entry','global']],['화면 아닌 응답',['raw']],['도달 불가',['dead']]];
document.getElementById('fk').innerHTML=FK.map(([l])=>`<button class="chip" data-k="${l}" aria-pressed="${l==='전체'}">${l}</button>`).join('');
function table(){const q=document.getElementById('q').value.trim().toLowerCase(),ks=FK.find(x=>x[0]===fk)[1];
 const l=N.filter(n=>(!ks||ks.includes(n.kind))&&(!q||(n.name+' '+(n.url||'')+' '+n.desc+' '+n.group).toLowerCase().includes(q)));
 document.getElementById('cnt').textContent=`${l.length}개`;
 document.getElementById('tb').innerHTML=l.map(n=>`<tr class="r" data-id="${esc(n.id)}" tabindex="0"><td>${n.shot?`<img class="th" loading="lazy" src="${esc(n.shot)}" alt="">`:''}</td><td>${esc(n.name)}${orphan.has(n.id)?' <span class="pill w">고아</span>':''}</td><td class="m">${esc(n.url||'—')}</td><td>${KL[n.kind]}</td><td>${esc(n.desc||'—')}</td><td>${esc(n.cond||'—')}</td><td class="n">${IN[n.id].filter(real).length}</td><td class="n">${OUT[n.id].filter(real).length}</td></tr>`).join('');
 document.querySelectorAll('#tb tr').forEach(r=>{const go=()=>{if(byId[r.dataset.id].kind==='raw')return;pick(r.dataset.id);document.getElementById('gw').scrollIntoView({block:'center'})};r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter')go()})})}
document.getElementById('fk').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;fk=b.dataset.k;document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',x===b));table()});
document.getElementById('q').addEventListener('input',table);
table();draw();

// ── 캡처 모음
{const V=N.filter(n=>n.shot),Z=N.filter(n=>n.noshot);let gk='전체';const GK=[['전체',null],['주소 있는 화면',['tab','page','redirect']],['시트·대화상자',['sheet']],['시스템·전역',['system','global']]];
 document.getElementById('galn').textContent=`화면 ${V.length+Z.length}개 중 ${V.length}개를 찍었습니다. 캡처를 누르면 지도에서 그 화면의 들어오는 길과 나가는 길을 봅니다.`;
 document.getElementById('gk').innerHTML=GK.map(([l])=>`<button class="chip" data-g="${l}" aria-pressed="${l==='전체'}">${l}</button>`).join('');
 const gal=()=>{const ks=GK.find(x=>x[0]===gk)[1],gs=new Map();V.filter(n=>!ks||ks.includes(n.kind)).forEach(n=>{if(!gs.has(n.group))gs.set(n.group,[]);gs.get(n.group).push(n)});
  document.getElementById('gal').innerHTML=[...gs].map(([g,l])=>`<div><h3>${esc(g)} ${l.length}</h3><div class="gg">${l.map(n=>`<button class="gc" data-pick="${esc(n.id)}"><img loading="lazy" src="${esc(n.shot)}" alt=""><span>${esc(n.name)}</span></button>`).join('')}</div></div>`).join('')};
 gal();document.getElementById('gk').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;gk=b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b));gal()});
 document.getElementById('gal').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;pick(b.dataset.pick);document.querySelector('.main').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});
 document.querySelector('#nos summary').textContent=`캡처가 없는 화면 ${Z.length}개와 이유`;
 document.getElementById('nosl').innerHTML=Z.map(n=>`<div><b>${esc(n.name)}</b><span>${esc(n.noshot)}</span></div>`).join('');
 const lb=document.getElementById('lb');document.getElementById('panel').addEventListener('click',e=>{const b=e.target.closest('[data-shot]');if(!b)return;lb.querySelector('img').src=b.dataset.shot;lb.querySelector('img').alt=b.getAttribute('aria-label');lb.showModal();lb.scrollTop=0});lb.addEventListener('click',()=>lb.close());}
</script>
