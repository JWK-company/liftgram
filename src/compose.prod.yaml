# @plm SRS-049  운영 배포(h2500-3) 덮어쓰기 — compose.yaml 위에 얹는다
#
#   docker compose -p liftgram -f compose.yaml -f compose.prod.yaml up -d --wait
#
# compose.yaml과 다른 것:
#   ① **DB도 이 서버에서 돈다** (2026-10-26 Neon에서 옮겨 왔다 — 화면 응답이 DB 왕복 220ms에 묶여 있었다).
#      데이터는 named volume `liftgram_pgdata`. 백업은 scripts/backup-h2500-3.sh(cron).
#   ② **루프백에만 연다** — 공용 서버다. 밖에서 들어오는 길은 Cloudflare 터널 하나뿐이다
#      (liftgram.tarae.org → http://localhost:${WEB_PORT}). db·broker는 호스트에 노출하지 않는다.
#   ③ 서버가 재부팅돼도 다시 뜬다(restart).
services:
  db:
    ports: !reset []
    restart: unless-stopped

  broker:
    ports: !reset []
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL이 필요하다}

  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL이 필요하다}
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    ports: !override ["127.0.0.1:${WEB_PORT:?WEB_PORT가 필요하다}:3000"]
