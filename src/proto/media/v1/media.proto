// @plm SRS-019  미디어 계약 — 사진을 올리고, 그 사진을 어디서 볼 수 있는지 알려 준다
//
// ─────────────────────────────────────────────────────────────────────────────
// ── 왜 바이트를 RPC로 나르나 ────────────────────────────────────────────────
// 사진은 별도 REST 엔드포인트로 받는 편이 흔하지만, 그러면 인증·오류 매핑·요청 제한이
// **두 벌**이 된다(옛 서버가 그랬다 — Connect 밖의 multipart 라우트 하나 때문에 가드가 따로 붙었다).
// 여기서는 계약 하나로 통일하고, 브라우저 쪽에서만 이 클라이언트를 **binary 전송**으로 만든다.
// JSON이면 base64로 33%가 붙지만 binary면 원본 그대로 간다.
//
// ── 보는 쪽은 RPC가 아니다 ──────────────────────────────────────────────────
// `<img src>`는 Connect를 말하지 못한다. 그래서 **읽기만** 평범한 HTTP다:
//   GET /media/file/{key}
// 키는 무작위다 — 주소를 아는 것이 곧 권한이다(capability URL). 옛 서버와 같은 모델이라
// 이미 올라간 사진의 주소가 그대로 유효하다.
//
// ── 서버가 돌려주는 url이 상대경로인 이유 ───────────────────────────────────
// 저장소가 로컬 디스크든 R2든 **주소는 같다**(`/media/file/<key>`). 서버가 프록시로 서브하므로
// 저장소를 바꿔도 이미 올라간 글의 주소가 깨지지 않는다(ADR-016).
// ─────────────────────────────────────────────────────────────────────────────
syntax = "proto3";

package media.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/JWK-company/liftgram/src/backend/gen/media/v1;mediav1";

// 지금은 사진뿐이다. 영상은 저장 비용·재생 규격이 달라 따로 정한다.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
}

message Media {
  string id = 1;
  // 화면이 그대로 <img src>에 넣는 값. 상대경로다(`/media/file/<key>`).
  string url = 2;
  MediaKind kind = 3;
  string content_type = 4;
  int64 bytes = 5;
  google.protobuf.Timestamp created_at = 6;
}

message UploadImageRequest {
  // 10MB. 옛 서버의 multer 한도와 같다 — 그보다 큰 사진은 브라우저에서 줄여 보낸다.
  bytes data = 1 [(buf.validate.field).bytes = {min_len: 1, max_len: 10485760}];
  // jpeg · png · webp · gif만 받는다(정확한 목록은 service가 지킨다 — 규칙은 한 곳에).
  string content_type = 2 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
}

message UploadImageResponse {
  Media media = 1;
}

service MediaService {
  // 로그인한 사람만 올릴 수 있다. 올린 사람이 소유자로 기록된다.
  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse) {}
}
