// @plm SRS-048  코칭 계약 — 사람이 사람을 가르친다 (SAD-022 · ADR-028)
//
// ─────────────────────────────────────────────────────────────────────────────
// ── 알고리즘이 처방하지 않는다 ──────────────────────────────────────────────
// 코칭의 주체는 **사람**(트레이너·상급자)이다. 서버가 하는 일은 ① 누가 누구를 볼 수 있는지 지키고
// ② 본 것을 **사실 그대로** 집계해 주는 것뿐이다. "이렇게 하세요"는 트레이너가 말한다.
// 그래서 이 계약에는 추천·제안 RPC가 없다(ADR-028).
//
// ── 동의가 먼저다 ───────────────────────────────────────────────────────────
// 요청은 어느 쪽에서든 걸 수 있지만 **반대편이 수락해야** 열린다. 요청한 사람이 자기 요청을
// 수락할 수 없다 — 그러면 동의가 아니라 통보다.
//
// ── 열리는 범위는 정해져 있다 ───────────────────────────────────────────────
// 루틴 편집 · 주간 스케줄 편집 · 기록 열람 셋뿐이다. **신체 정보는 범위에 없다**(기본 제외).
// 해지하면 그 순간 전부 닫힌다.
//
// ── 본 것은 남는다 ──────────────────────────────────────────────────────────
// 트레이너가 무엇을 보고 무엇을 고쳤는지 감사 기록에 남고, **회원이 그것을 읽을 수 있다**.
// 감시받는 쪽이 감시 기록을 볼 수 없으면 그건 신뢰 장치가 아니다.
// ─────────────────────────────────────────────────────────────────────────────
syntax = "proto3";

package coaching.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/JWK-company/liftgram/src/backend/gen/coaching/v1;coachingv1";

// 상대방. 트레이너가 보면 회원, 회원이 보면 트레이너다.
message Peer {
  string id = 1;
  string display_name = 2;
  string avatar_url = 3;
  // 스스로 밝힌 운동 경력. **자격 보증이 아니다**(화면이 그 고지를 함께 띄운다).
  string experience_level = 4;
  // [원본] 코칭 의향 · [개선] SPEC-052 — 뜻만 「코치 찾기 노출」(코치 여부가 아니다 · 배지는 is_coach).
  bool trainer_intent = 5;
  // 코치 소개(80자)·태그(hypertrophy·strength·diet·rehab·beginner·powerlifting 중 3개까지) — SPEC-050.
  string coach_bio = 6;
  repeated string coach_tags = 7;
  // 「코치」 배지(SPEC-052) — 활성 연결에서 코치(trainer)인 회원이 한 명 이상. 서버가 계산하는 파생값.
  bool is_coach = 8;
}

// 회원이 여는 범위(SPEC-050). 키는 이 넷뿐 — 서버는 이 넷만 저장하고, 옛 행에 없는 키는 false 로 읽는다.
//   log_view     운동 기록·분석
//   routine_edit 코치가 짠 루틴 받기 · 내 루틴 처방 고치기
//   body_view    체중·인바디(bodyweight_logs 의 정해진 칸만)
//   past_records 연결 전 기록도(끄면 동의 시각 뒤 기록만 — 모든 코칭 RPC 에 같은 컷)
// 기본값 = log_view·routine_edit 켬, body_view·past_records 끔.
message CoachingScope {
  bool log_view = 1;
  bool routine_edit = 2;
  bool body_view = 3;
  bool past_records = 4;
}

enum GrantStatus {
  GRANT_STATUS_UNSPECIFIED = 0;
  GRANT_STATUS_PENDING = 1;
  GRANT_STATUS_ACTIVE = 2;
  GRANT_STATUS_REVOKED = 3;
}

// 나는 이 관계에서 어느 쪽인가. 같은 행을 양쪽이 보므로 **보는 사람 기준**으로 채운다.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_TRAINER = 1;
  SIDE_MEMBER = 2;
}

message Grant {
  string id = 1;
  GrantStatus status = 2;
  // 누가 걸었나. 수락은 **반대편만** 할 수 있다.
  Side requested_by = 3;
  Side role_of_me = 4;
  Peer peer = 5;
  int64 created_at = 6;
  // 수락(동의) 시각. 아직이면 0.
  int64 consent_at = 7;
  // 지금 열린(수락 전이면 요청된) 범위.
  CoachingScope scope = 8;
  // 요청할 때 남긴 한 줄(100자). 없으면 빈 문자열.
  string request_note = 9;
}

// 코치의 초대 코드(SPEC-050). code = Crockford base32 8자 — 화면은 4-4 로 끊어 보인다(하이픈은 화면 몫).
message Invite {
  string code = 1;
  int64 created_at = 2;
  int64 expires_at = 3;
}

// 세트 처방 — 앱의 어휘(SRS-043)를 그대로 쓴다.
enum SetType {
  SET_TYPE_UNSPECIFIED = 0;
  SET_TYPE_WARMUP = 1;
  SET_TYPE_TOP = 2;
  SET_TYPE_BACKOFF = 3;
  SET_TYPE_NORMAL = 4;
  SET_TYPE_DROP = 5;
}
enum LoadHint {
  LOAD_HINT_UNSPECIFIED = 0;
  LOAD_HINT_LIGHT = 1;
  LOAD_HINT_MEDIUM = 2;
  LOAD_HINT_HEAVY = 3;
}

// 처방 무게 기준(#56 · SRS-063) — 처방을 쓴 사람이 고른 계산 방식. 미지정이면 무게 기준 없음(기존 처방).
enum LoadBasis {
  LOAD_BASIS_UNSPECIFIED = 0;
  LOAD_BASIS_PCT_1RM = 1; // 기록으로 추정한 1RM 의 N%
  LOAD_BASIS_PCT_TOP = 2; // 같은 블록 탑셋의 N%(백오프)
  LOAD_BASIS_FIXED = 3; // 무게 직접(kg)
}

message PrescribedSet {
  SetType set_type = 1;
  // 남길 여유 반복(RIR). 0~6 밖의 값은 서버가 잘라 낸다. 미지정이면 -1.
  int32 target_rir = 2;
  // 반복 범위. 미지정이면 0.
  int32 rep_min = 3;
  int32 rep_max = 4;
  LoadHint load_hint = 5;
  // 무게 기준(SRS-063). load_pct 는 pct_1rm 30~100 · pct_top 50~100(밖이면 서버가 버린다), 미지정이면 0.
  LoadBasis load_basis = 6;
  int32 load_pct = 7;
  // fixed 의 무게(정규 kg · 0~500). 미지정이면 0.
  double load_kg = 8;
}

message RoutineExercise {
  string id = 1;
  string exercise_id = 2;
  // 회원의 기기에 있는 이름. 못 찾으면 빈 문자열(서버는 카탈로그를 다시 해석하지 않는다).
  string exercise_name = 3;
  int32 target_sets = 4;
  repeated PrescribedSet prescription = 5;
}

message Routine {
  string id = 1;
  string name = 2;
  repeated RoutineExercise exercises = 3;
}

// 사실 집계만. **추정도 제안도 없다** — 판단은 트레이너가 한다(ADR-028).
message MuscleVolume {
  string muscle = 1;
  double volume_kg = 2;
}
message SessionSummary {
  string name = 1;
  int64 started_at = 2;
  int32 duration_seconds = 3;
  double total_volume_kg = 4;
  int32 pr_count = 5;
}
message MemberReport {
  int32 weeks = 1;
  int32 sessions_count = 2;
  double sessions_per_week = 3;
  double total_volume_kg = 4;
  repeated MuscleVolume muscle_volume = 5;
  repeated SessionSummary recent_sessions = 6;
}

message AuditEntry {
  string id = 1;
  string actor_id = 2;
  // 무엇을 했나: request·accept·revoke·report_view·routines_view·prescription_edit
  // ·summary_send·summary_view·records_view(SRS-080).
  string action = 3;
  int64 created_at = 4;
}

message SearchTrainersRequest {
  string query = 1 [(buf.validate.field).string.max_len = 100];
}
message SearchTrainersResponse {
  repeated Peer peers = 1;
}

// 요청은 **정확히 한쪽만** 지정한다. 둘 다 비거나 둘 다 채우면 누가 가르치는지 알 수 없다.
message RequestCoachingRequest {
  string trainer_id = 1;
  string member_id = 2;
  // 회원이 요청할 때 여는 범위. 비우면 기본값. 코치가 요청하면 무시한다(범위는 회원이 수락할 때 고른다).
  CoachingScope scope = 3;
  // 한 줄 메시지(100자).
  string note = 4 [(buf.validate.field).string.max_len = 100];
}
message RequestCoachingResponse {
  Grant grant = 1;
}

message ListGrantsRequest {}
message ListGrantsResponse {
  repeated Grant grants = 1;
}

message AcceptGrantRequest {
  string grant_id = 1 [(buf.validate.field).string.min_len = 1];
  // 회원이 수락할 때 여는 범위. 비우면 요청 때 저장된 값. 코치가 수락하면 무시한다.
  CoachingScope scope = 2;
}
message AcceptGrantResponse {
  Grant grant = 1;
}

message RevokeGrantRequest {
  string grant_id = 1 [(buf.validate.field).string.min_len = 1];
}
message RevokeGrantResponse {
  Grant grant = 1;
}

// 범위 바꾸기 — 회원만, 활성 관계만.
message UpdateScopeRequest {
  string grant_id = 1 [(buf.validate.field).string.min_len = 1];
  CoachingScope scope = 2 [(buf.validate.field).required = true];
}
message UpdateScopeResponse {
  Grant grant = 1;
}

// ── 초대 코드(SPEC-050) ── 셋 다 로그인 필수 · 코칭 전용 요청 제한(사용자·IP 분당 10 · 하루 실패 50).
// 만료·회수·없음은 같은 NotFound 「초대 코드를 찾을 수 없어요. 코치에게 새 코드를 받아 주세요」.

// 코치가 새 코드를 만든다(옛 코드는 그 자리에서 회수 · 14일 유효).
message CreateInviteRequest {}
message CreateInviteResponse {
  Invite invite = 1;
}

// 코치가 지금 살아 있는 내 코드를 본다(없으면 invite 비어 있음 — 화면이 「새로 만들기」를 보인다).
message GetMyInviteRequest {}
message GetMyInviteResponse {
  Invite invite = 1;
}

// 회원이 코드로 코치 카드를 본다(연결 전). 하이픈·공백·소문자는 서버가 정리한다.
message GetInviteRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1, max_len: 20}];
}
message GetInviteResponse {
  Peer trainer = 1;
  int64 expires_at = 2;
}

// 회원이 범위를 골라 바로 연결한다(동의 = 이 호출). 같은 쌍의 옛 관계는 되살린다.
message AcceptInviteRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1, max_len: 20}];
  CoachingScope scope = 2;
}
message AcceptInviteResponse {
  Grant grant = 1;
}

message GetMemberReportRequest {
  string member_id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetMemberReportResponse {
  MemberReport report = 1;
}

message ListMemberRoutinesRequest {
  string member_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ListMemberRoutinesResponse {
  repeated Routine routines = 1;
}

message SetMemberPrescriptionRequest {
  string member_id = 1 [(buf.validate.field).string.min_len = 1];
  string routine_id = 2 [(buf.validate.field).string.min_len = 1];
  string routine_exercise_id = 3 [(buf.validate.field).string.min_len = 1];
  // 비우면 처방을 **지운다**(회원은 자유롭게 한다).
  repeated PrescribedSet prescription = 4;
}
message SetMemberPrescriptionResponse {
  repeated PrescribedSet prescription = 1;
}

message ListAuditRequest {
  string grant_id = 1 [(buf.validate.field).string.min_len = 1];
}
message ListAuditResponse {
  repeated AuditEntry entries = 1;
}

// ── 기간 성과 요약(SRS-079·080 · ADR-040·041 · SAD-024) ──────────────────────
// @plm SRS-080
//
// 요약은 **회원 기기가 계산한다**(core periodSummary — ADR-040). 서버는 가드·보관·전달만 한다:
// 스냅샷을 해석하지 않고, 최상위 schemaVersion 이 요청의 schema_version 과 같은지·JSON 객체인지만 본다.
// 기간은 epoch ms(UTC 절대값) [start, end) — 날짜 경계는 스냅샷 range.tz 가 회원 기준으로 싣는다.
//
// 이 넷에는 `idempotency_level = NO_SIDE_EFFECTS`를 달지 않는다 — 달면 connect-web 이 GET으로 바꿔
// 브라우저·CDN 캐시 대상이 된다(S-20). 응답에는 서버가 `Cache-Control: no-store`를 붙인다.

message SendProgressSummaryRequest {
  // 받을 트레이너. 회원(=나) → 이 트레이너 관계가 active ∧ logView 여야 한다.
  string trainer_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  int64 period_start = 2 [(buf.validate.field).int64.gt = 0];
  int64 period_end = 3 [(buf.validate.field).int64.gt = 0];
  // 지원 목록은 서버가 정한다(지금 {1}). 스냅샷 최상위 schemaVersion 과 같아야 한다.
  int32 schema_version = 4 [(buf.validate.field).int32.gte = 1];
  // SummaryV1 JSON 객체(회원이 끈 섹션은 키째 빠진다). 64KB 상한.
  string snapshot_json = 5 [(buf.validate.field).string = {min_len: 2, max_bytes: 65536}];
  // 기기가 만든 uuid — 같은 값으로 다시 보내면 같은 요약·같은 DM 하나로 끝난다.
  string client_id = 6 [(buf.validate.field).string.uuid = true];
}
message SendProgressSummaryResponse {
  string summary_id = 1;
}

message ProgressSummary {
  string id = 1;
  string member_id = 2;
  string trainer_id = 3;
  int64 period_start = 4;
  int64 period_end = 5;
  int32 schema_version = 6;
  // 보낸 그대로의 JSON(서버는 해석하지 않았다). 화면은 core parseSummaryV1 로 거른 뒤에 그린다(S-18).
  string snapshot_json = 7;
  int64 created_at = 8;
}

message GetProgressSummaryRequest {
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message GetProgressSummaryResponse {
  ProgressSummary summary = 1;
}

// 보낸 요약 목록의 한 줄 — 스냅샷은 싣지 않는다(펼칠 때 GetProgressSummary).
message SentSummary {
  string id = 1;
  string trainer_id = 2;
  int64 period_start = 3;
  int64 period_end = 4;
  int32 schema_version = 5;
  // DM 까지 갔나. false 면 저장만 되고 전달 전(같은 client_id 로 다시 보내면 그때 간다).
  bool delivered = 6;
  int64 created_at = 7;
}

message ListSentSummariesRequest {
  // 앞 페이지의 next_cursor. 비우면 최신부터.
  string cursor = 1 [(buf.validate.field).string.max_len = 200];
}
message ListSentSummariesResponse {
  // 최근 것부터 최대 50개.
  repeated SentSummary summaries = 1;
  // 다음 페이지가 없으면 빈 문자열.
  string next_cursor = 2;
}

// 트레이너 리포트용 원본 레코드(scope=logView · ADR-040 개정).
// 서버가 내주는 기간 = [period_start − (period_end − period_start), period_end) — 직전 기간 비교용.
// 길이 ≤ 400일 · start < end · end ≤ now+1일. 컬렉션·칸은 **서버 상수 허용 목록**만이다
// (notes·note·image_url·prescription·prev_* 없음 · user_profiles·import_* 는 영원히 없다 ·
// bodyweight_logs 는 body_view 를 열었을 때만 정해진 칸으로 — SPEC-050).
// 예외 하나(SPEC-050 P4 처방 대 실제): 코치가 보낸 루틴(routine_id 가 coach-…)으로 한 운동의 블록에만
// prescription·target_sets·target_reps_min·target_reps_max·target_weight_kg 를 더 싣는다(코치가 보낸 값의 복사본).
message GetMemberRecordsRequest {
  string member_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  int64 period_start = 2 [(buf.validate.field).int64.gt = 0];
  int64 period_end = 3 [(buf.validate.field).int64.gt = 0];
}
message GetMemberRecordsResponse {
  // 각 원소 = 허용 칸만 남긴 JSON 객체 하나(기기 raw 레코드와 같은 snake_case 키).
  // 완료된 운동과 그 자식, 그 운동에 실제로 쓰인 커스텀 종목만.
  repeated string workouts = 1;
  repeated string workout_exercises = 2;
  repeated string set_logs = 3;
  repeated string exercises = 4;
  // 실제로 내준 기간(epoch ms) [served_start, served_end). 지난 기록(past_records)을 열지 않았으면
  // served_start 는 동의 시각보다 앞서지 않는다(SPEC-050 visibleFrom).
  int64 served_start = 5;
  int64 served_end = 6;
  // body_view 를 열었을 때만 — 체중·인바디(id·measured_at·weight_kg·skeletal_muscle_kg·body_fat_pct 만).
  // 닫혀 있으면 언제나 0건이다.
  repeated string bodyweight_logs = 7;
}

// ── 코치가 짠 루틴 보내기(SPEC-050 P3b) ─────────────────────────────────────
// 코치 기기의 초안(source_routine_id)을 회원 sync 레코드에 쓴다 — 루틴 id `coach-<crid>` · 줄 id `coach-<crid>-<초안 줄 id>`.
// 같은 초안을 다시 보내면 같은 회원 루틴이 바뀐다(id 그대로 · 빠진 줄은 지운다 · 회원의 폴더·순서·보관·변형 칸은 덮지 않는다).
// 연결이 끝나면(해지·탈퇴) 회원 루틴은 origin coach_ended — 회원 것이 된다.

// 초안 한 줄. 변형(기구·그립…) 칸은 보내지 않는다 — 회원이 고른다.
message SentRoutineLine {
  // 초안(코치 기기) 줄 id — 회원 줄 id 는 coach-<crid>-<이 값>.
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string exercise_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  int32 target_sets = 3;
  // 0 = 없음.
  int32 target_reps_min = 4;
  int32 target_reps_max = 5;
  // 0 = 없음(정규 kg).
  double target_weight_kg = 6;
  int32 rest_seconds = 7;
  string superset_group = 8 [(buf.validate.field).string.max_len = 64];
  string note = 9 [(buf.validate.field).string.max_len = 500];
  int32 sort_order = 10;
  // 유산소 목표 JSON {durationSec,distanceM,incline,level,speed}. 비우면 없음.
  string cardio_target_json = 11 [(buf.validate.field).string.max_len = 2000];
  // 세트별 처방 JSON(core PrescribedSet[] 그대로) — 서버가 같은 규칙으로 정리한다(scheme·feeder·amrap·rest 보존). 비우면 없음.
  string prescription_json = 12 [(buf.validate.field).string.max_len = 20000];
}

enum SentRoutineStatus {
  SENT_ROUTINE_STATUS_UNSPECIFIED = 0;
  SENT_ROUTINE_STATUS_ACTIVE = 1;
  // 연결이 끝나 회원 것이 됐다(다시 보내면 새 루틴).
  SENT_ROUTINE_STATUS_ENDED = 2;
}

message SentRoutine {
  // coaching_routines 행 id(crid).
  string id = 1;
  string source_routine_id = 2;
  string member_routine_id = 3;
  // 마지막으로 보낸 이름(회원 기기 레코드의 이름).
  string name = 4;
  SentRoutineStatus status = 5;
  // 마지막으로 보낸 시각(epoch ms).
  int64 sent_at = 6;
  string member_id = 7;
}

message SendRoutineRequest {
  string member_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string source_routine_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 60자(룬)·메모 500자 · 줄 30개 · 줄마다 처방 20줄 — 상한 검사는 서버 몫(한국어 문구).
  string name = 3 [(buf.validate.field).string.max_len = 400];
  string notes = 4 [(buf.validate.field).string.max_len = 4000];
  repeated SentRoutineLine lines = 5;
}
message SendRoutineResponse {
  SentRoutine routine = 1;
  // 처음 보냈나(false 면 같은 회원 루틴을 바꿨다).
  bool created = 2;
}

message ListSentRoutinesRequest {
  string member_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message ListSentRoutinesResponse {
  // 최근에 보낸 것부터.
  repeated SentRoutine routines = 1;
}

// ── 코치 코멘트·담당 회원 점검(SPEC-050 P4) ─────────────────────────────────
// 코멘트 = 코치가 회원 운동 하나에 남기는 말(300자). 그 회원의 완료 운동 · visibleFrom 뒤 · logView 일 때만 쓴다.
// 읽기 — 코치는 지금 활성 ∧ logView ∧ 차단 아님일 때 자기 코멘트만 · 회원은 언제나(차단한 코치 것은 빠진다).
// 숨기기 — 코치(자기 것)·회원(자기 운동의 것). 숨긴 코멘트는 누구에게도 나가지 않는다.

message CoachComment {
  string id = 1;
  string workout_id = 2;
  string member_id = 3;
  string trainer_id = 4;
  // 코치 표시 이름(지금 이름).
  string trainer_name = 5;
  string body = 6;
  int64 created_at = 7;
  // 보는 사람이 숨길 수 있나(코치는 자기 것 · 회원은 자기 운동의 것).
  // SPEC-059 — 숨기기를 뗐다: 서버는 늘 false(옛 앱 판 호환을 위해 필드는 남김)
  bool can_hide = 8;
}

message AddCoachCommentRequest {
  string member_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string workout_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 300자(룬) 상한은 서버 몫(한국어 문구). 여기서는 바이트로 넉넉히.
  string body = 3 [(buf.validate.field).string.max_bytes = 4000];
}
message AddCoachCommentResponse {
  CoachComment comment = 1;
}

// 코치: member_id 필수 · workout_id 를 비우면 이 회원에게 남긴 내 코멘트 전부(최근 500).
// 회원: member_id 를 비우거나 나 · workout_id 필수(내 운동의 코멘트 전부).
message ListCoachCommentsRequest {
  string member_id = 1 [(buf.validate.field).string.max_len = 64];
  string workout_id = 2 [(buf.validate.field).string.max_len = 64];
}
message ListCoachCommentsResponse {
  repeated CoachComment comments = 1;
}

message HideCoachCommentRequest {
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}
message HideCoachCommentResponse {}

// 담당 회원 한 명의 이번 주 점검 — 사실 숫자만(판단은 코치가 한다). 모두 visibleFrom 뒤만 센다.
message MemberDigest {
  string member_id = 1;
  // logView 가 꺼져 있으면 false — 숫자는 모두 0(서버가 세지 않는다).
  bool log_view = 2;
  // week_start 뒤에 시작한 완료 운동 수.
  int32 week_workouts = 3;
  // 마지막 완료 운동의 시작 시각(epoch ms). 없으면 0 — 「N일째 쉬는 중」은 화면이 이 값과 기기 날짜로 센다.
  int64 last_workout_at = 4;
  // 그중 이 코치가 보낸 루틴으로 한 운동 수.
  int32 week_coach_routine_workouts = 5;
}

message ListMemberDigestRequest {
  // 「이번 주」 시작(epoch ms · 보는 기기의 월요일 0시). 지금−8일보다 이르거나 지금보다 늦으면 지금−7일로 본다.
  int64 week_start = 1;
}
message ListMemberDigestResponse {
  // 지금 활성인 담당 회원마다 하나(차단 사이는 뺀다).
  repeated MemberDigest members = 1;
  // 담당 회원이 200명을 넘어 잘렸으면 true — 화면은 점검에 없는 회원을 원래 순서 뒤에 그대로 둔다.
  bool truncated = 2;
}

service CoachingService {
  // 코칭 의향을 밝힌 사람을 찾는다. 차단한(또는 나를 차단한) 사람은 보이지 않는다.
  rpc SearchTrainers(SearchTrainersRequest) returns (SearchTrainersResponse) {}
  rpc RequestCoaching(RequestCoachingRequest) returns (RequestCoachingResponse) {}
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {}
  // 수락 = 동의. **요청한 쪽은 부를 수 없다.**
  rpc AcceptGrant(AcceptGrantRequest) returns (AcceptGrantResponse) {}
  // 해지는 양쪽 다 할 수 있고, 그 순간 모든 접근이 닫힌다.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse) {}
  // 범위 바꾸기 — 회원만, 활성 관계만(SPEC-050).
  rpc UpdateScope(UpdateScopeRequest) returns (UpdateScopeResponse) {}
  // 초대 코드(SPEC-050).
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {}
  rpc GetMyInvite(GetMyInviteRequest) returns (GetMyInviteResponse) {}
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {}
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {}

  // 회원 기록 열람(scope=logView). 사실 집계만 돌려준다.
  rpc GetMemberReport(GetMemberReportRequest) returns (GetMemberReportResponse) {}
  // 회원 루틴 열람·처방(scope=routineEdit).
  rpc ListMemberRoutines(ListMemberRoutinesRequest) returns (ListMemberRoutinesResponse) {}
  rpc SetMemberPrescription(SetMemberPrescriptionRequest) returns (SetMemberPrescriptionResponse) {}

  // 코칭 이력. **양쪽 다 읽을 수 있다** — 회원이 볼 수 없으면 신뢰 장치가 아니다.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse) {}

  // ── 기간 성과 요약(SRS-080) ── 넷 다 NO_SIDE_EFFECTS 를 달지 않는다(S-20).
  // 회원 → 담당 트레이너. 저장 + 1:1 DM(SUMMARY) + 알림(coaching_summary). 같은 client_id 는 한 번만 도착한다.
  rpc SendProgressSummary(SendProgressSummaryRequest) returns (SendProgressSummaryResponse) {}
  // 그 요약의 회원 ∨ 받은 트레이너(지금 active ∧ logView ∧ 보낸 때와 같은 동의)만. 남이면 NotFound.
  rpc GetProgressSummary(GetProgressSummaryRequest) returns (GetProgressSummaryResponse) {}
  // 내가 보낸 요약(최근 50 + 커서).
  rpc ListSentSummaries(ListSentSummariesRequest) returns (ListSentSummariesResponse) {}
  // 트레이너 리포트용 원본 레코드(허용 컬렉션·칸·기간만 · 2MB 상한).
  rpc GetMemberRecords(GetMemberRecordsRequest) returns (GetMemberRecordsResponse) {}

  // ── 코치 루틴(SPEC-050 P3b) ── 코치만 · 활성 ∧ routineEdit ∧ 차단 아님. 보내기는 코치당 시간당 60번.
  rpc SendRoutine(SendRoutineRequest) returns (SendRoutineResponse) {}
  // 이 회원에게 보낸 루틴(끝난 것 포함 · 코치 본인 것만).
  rpc ListSentRoutines(ListSentRoutinesRequest) returns (ListSentRoutinesResponse) {}

  // ── 코멘트·점검(SPEC-050 P4 · 스펙의 AddComment·ListComments·HideComment — 피드 댓글 계약과 이름이 겹쳐 Coach 를 붙였다) ── 코멘트는 코치당 회원당 하루 20개. 남기면 회원에게 알림(coaching_comment · ref_id = 운동 id).
  rpc AddCoachComment(AddCoachCommentRequest) returns (AddCoachCommentResponse) {}
  rpc ListCoachComments(ListCoachCommentsRequest) returns (ListCoachCommentsResponse) {}
  // SPEC-059 — 쓰지 않음: 서버가 늘 Unimplemented 로 거절(옛 앱 판 호환을 위해 모양은 남김)
  rpc HideCoachComment(HideCoachCommentRequest) returns (HideCoachCommentResponse) {}
  // 코치(viewer)의 활성 담당 회원마다 이번 주 운동 수·마지막 운동·코치 루틴 운동 수.
  rpc ListMemberDigest(ListMemberDigestRequest) returns (ListMemberDigestResponse) {}
}
