// @plm SRS-007  피드 계약 — 게시물·좋아요·댓글·팔로우
//
// ─────────────────────────────────────────────────────────────────────────────
// 이 앱의 소셜은 "오운완을 올리고 서로 본다"가 전부다. 그래서 게시물의 중심은 사진이 아니라
// **운동 기록**이다(kind=workout) — 무엇을 얼마나 들었는지가 그대로 실린다.
//
// ── 무엇이 내 피드에 보이는가 ───────────────────────────────────────────────
//   · 내 글은 항상
//   · 내가 팔로우하는 사람의 글 중 공개범위가 public|followers 인 것
//   · 차단한/차단당한 사람은 **양쪽 다** 제외
//   · 모더레이션에서 내려간 글 제외
// 옛 백엔드(server/)와 같은 규칙이다 — 이행 중 두 구현이 다른 피드를 보여 주면 안 된다.
//
// ── 커서 ────────────────────────────────────────────────────────────────────
// 정렬이 (created_at desc, id desc)이므로 커서도 그 **두 값을 함께** 싣는다.
// created_at만 쓰면 같은 밀리초의 글이 페이지 경계에서 사라지거나 두 번 나온다(옛 서버가 밟은 문제).
//
// ── 아직 없는 것 ────────────────────────────────────────────────────────────
// 사진 업로드(미디어 저장소가 필요하다) · 스토리 · 신고 큐 · DM · 알림.
// `media_urls`는 계약에 미리 둔다 — 나중에 채우기 위해 메시지를 바꾸지 않으려는 것이다.
// ─────────────────────────────────────────────────────────────────────────────
syntax = "proto3";

package feed.v1;

import "buf/validate/validate.proto";
import "gear/v1/gear.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/JWK-company/liftgram/src/backend/gen/feed/v1;feedv1";

// 누구에게 보일지. 글마다 정한다.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;
  // 팔로워에게만.
  VISIBILITY_FOLLOWERS = 2;
  // 나만 — 기록용으로 남기고 싶을 때.
  VISIBILITY_PRIVATE = 3;
}

// 글의 종류. 운동 요약이 붙었는지로 화면이 카드 모양을 바꾼다.
enum PostKind {
  POST_KIND_UNSPECIFIED = 0;
  POST_KIND_TEXT = 1;
  POST_KIND_WORKOUT = 2;
  POST_KIND_IMAGE = 3;
}

// 글쓴이 요약 — 피드가 사용자 전체를 싣지 않도록 필요한 것만.
message Author {
  string id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

// 오운완에 붙는 운동 요약. **서버가 다시 계산하지 않는다** — 기기에서 확정된 값을 그대로 싣는다
// (계산 규칙은 도메인에 하나뿐이고, 그 하나가 기기에서 이미 돌았다).
message WorkoutSummary {
  string workout_id = 1 [(buf.validate.field).string = {max_len: 64}];
  string workout_name = 2 [(buf.validate.field).string = {max_len: 80}];
  double total_volume_kg = 3 [(buf.validate.field).double = {gte: 0}];
  int32 working_sets = 4 [(buf.validate.field).int32 = {gte: 0}];
  int32 duration_seconds = 5 [(buf.validate.field).int32 = {gte: 0}];
  int32 pr_count = 6 [(buf.validate.field).int32 = {gte: 0}];
  // 게시 **시점의** 연속 일수·주간 목표 달성 — 나중에 다시 계산하지 않는다(그때의 자랑이므로).
  int32 streak_days = 7 [(buf.validate.field).int32 = {gte: 0}];
  bool weekly_reached = 8;
  // 종목·세트 전체. 보는 사람이 펼쳐 구경하고, 자기 루틴으로 가져갈 수 있다.
  repeated WorkoutExercise exercises = 9 [(buf.validate.field).repeated = {max_items: 40}];
}

// 무게는 **항상 kg**으로 싣는다 — 보는 사람이 자기 단위로 바꿔 읽는다.
message WorkoutSet {
  double weight_kg = 1 [(buf.validate.field).double = {gte: 0}];
  int32 reps = 2 [(buf.validate.field).int32 = {gte: 0}];
  bool is_warmup = 3;
  int32 partial_reps = 4 [(buf.validate.field).int32 = {gte: 0}];
}

message WorkoutExercise {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 120}];
  // 작성자의 종목 메모 — 가져가는 사람에게 팁이 함께 간다.
  string note = 2 [(buf.validate.field).string = {max_len: 500}];
  repeated WorkoutSet sets = 3 [(buf.validate.field).repeated = {max_items: 60}];
}

message Post {
  string id = 1;
  Author author = 2;
  PostKind kind = 3;
  string caption = 4;
  Visibility visibility = 5;
  WorkoutSummary workout = 6;
  repeated string media_urls = 7;
  int32 like_count = 8;
  int32 comment_count = 9;
  // 보는 사람이 이미 좋아요를 눌렀는가. 사람마다 다르므로 서버가 요청자 기준으로 채운다.
  bool liked_by_me = 10;
  google.protobuf.Timestamp created_at = 11;
  // 나중에 보려고 저장해 뒀는가. 좋아요와 달리 **남에게 보이지 않는다**.
  bool bookmarked_by_me = 12;
  // 착용장비 태그(ADR-027). 사진 **바깥**에 그린다 — 사진을 가리는 광고는 제재 대상이다.
  repeated gear.v1.GearTag gear = 13 [(buf.validate.field).repeated = {max_items: 8}];
}

message Comment {
  string id = 1;
  string post_id = 2;
  Author author = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  // 답글이면 부모 댓글. 답글의 답글은 만들지 않는다(한 단계까지만 — 화면이 감당하는 깊이다).
  string parent_id = 6;
  int32 like_count = 7;
  bool liked_by_me = 8;
  // 루트 댓글에만 의미가 있다.
  int32 reply_count = 9;
}

// 공개 프로필 — 남이 보는 나. 카운트는 저장된 값이 아니라 **셀 때 센다**(사람 수가 적고 자주 안 열린다).
message SocialProfile {
  Author author = 1;
  int32 post_count = 2;
  int32 follower_count = 3;
  int32 following_count = 4;
  // 내 프로필인가 — 팔로우/차단 버튼을 감춘다.
  bool is_self = 5;
  bool is_following = 6;
  // 내가 차단했는가(상대가 나를 차단한 경우는 애초에 조회가 막힌다).
  bool is_blocked = 7;
}

message HashtagCount {
  string tag = 1;
  int32 count = 2;
}

// 커서 — 정렬 키 두 개를 함께 싣는다(같은 시각의 글이 새거나 겹치지 않게).
message Cursor {
  google.protobuf.Timestamp created_at = 1;
  string id = 2;
}

message CreatePostRequest {
  string caption = 1 [(buf.validate.field).string = {max_len: 2000}];
  Visibility visibility = 2;
  // 있으면 kind=workout이 된다.
  WorkoutSummary workout = 3;
  repeated string media_urls = 4 [(buf.validate.field).repeated = {max_items: 10}];
  // 같은 글이 두 번 올라가지 않게(재시도·중복 탭). 같은 키로 다시 오면 처음 것을 그대로 돌려준다.
  string idempotency_key = 5 [(buf.validate.field).string = {max_len: 64}];
  // 착용장비 — 카테고리당 하나. 넘겨도 되고 안 넘겨도 된다.
  repeated gear.v1.GearTag gear = 6 [(buf.validate.field).repeated = {max_items: 8}];
}

message CreatePostResponse {
  Post post = 1;
}

message ListFeedRequest {
  Cursor cursor = 1;
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListFeedResponse {
  repeated Post posts = 1;
  // 다음 페이지가 없으면 비어 있다.
  Cursor next_cursor = 2;
}

message ListUserPostsRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  Cursor cursor = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListUserPostsResponse {
  repeated Post posts = 1;
  Cursor next_cursor = 2;
}

message DeletePostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message DeletePostResponse {}

message LikePostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message LikePostResponse {
  int32 like_count = 1;
  bool liked_by_me = 2;
}

message UnlikePostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message UnlikePostResponse {
  int32 like_count = 1;
  bool liked_by_me = 2;
}

message ListCommentsRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  Cursor cursor = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  Cursor next_cursor = 2;
}

message CreateCommentRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string body = 2 [(buf.validate.field).string = {min_len: 1, max_len: 1000}];
  // 있으면 답글이 된다. 답글에 답글을 달면 그 답글의 부모(루트)에 붙는다 — 깊이는 1단계.
  string parent_id = 3 [(buf.validate.field).string = {max_len: 64}];
}

message CreateCommentResponse {
  Comment comment = 1;
}

message DeleteCommentRequest {
  string comment_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message DeleteCommentResponse {}

message FollowRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message FollowResponse {
  bool following = 1;
}

message UnfollowRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message UnfollowResponse {
  bool following = 1;
}

message SearchUsersRequest {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 80}];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message UserResult {
  Author author = 1;
  bool following = 2;
}

message SearchUsersResponse {
  repeated UserResult users = 1;
}

message UpdatePostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string caption = 2 [(buf.validate.field).string = {max_len: 2000}];
  // UNSPECIFIED면 공개범위는 그대로 둔다.
  Visibility visibility = 3;
}

message UpdatePostResponse {
  Post post = 1;
}

message BookmarkPostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message BookmarkPostResponse {
  bool bookmarked = 1;
}

message UnbookmarkPostRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message UnbookmarkPostResponse {
  bool bookmarked = 1;
}

message ListBookmarksRequest {
  Cursor cursor = 1;
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListBookmarksResponse {
  repeated Post posts = 1;
  Cursor next_cursor = 2;
}

message ListHashtagPostsRequest {
  string tag = 1 [(buf.validate.field).string = {min_len: 1, max_len: 50}];
  Cursor cursor = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListHashtagPostsResponse {
  repeated Post posts = 1;
  Cursor next_cursor = 2;
}

message TrendingHashtagsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message TrendingHashtagsResponse {
  repeated HashtagCount tags = 1;
}

message GetProfileRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message GetProfileResponse {
  SocialProfile profile = 1;
}

message BlockUserRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message BlockUserResponse {
  bool blocked = 1;
}

message UnblockUserRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message UnblockUserResponse {
  bool blocked = 1;
}

// 팔로워/팔로잉 목록. 어느 쪽을 볼지는 mode가 정한다.
enum FollowListMode {
  FOLLOW_LIST_MODE_UNSPECIFIED = 0;
  FOLLOW_LIST_MODE_FOLLOWERS = 1;
  FOLLOW_LIST_MODE_FOLLOWING = 2;
}

message ListFollowsRequest {
  string user_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  FollowListMode mode = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}

message ListFollowsResponse {
  repeated UserResult users = 1;
}

// 발견 화면이 쓰는 것들 — 인기 글·추천 사람·통합 검색.
message ListExploreRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message ListExploreResponse {
  // **공개 글만**. 좋아요가 많은 순, 같으면 최신 순.
  repeated Post posts = 1;
}

message SuggestedUsersRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

message SuggestedUsersResponse {
  repeated UserResult users = 1;
}

message SearchRequest {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 80}];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

// 한 번의 검색이 세 갈래를 돌려준다 — 화면이 세 번 묻지 않게.
message SearchResponse {
  repeated UserResult users = 1;
  repeated HashtagCount tags = 2;
  // 캡션이 걸린 **공개 글만**.
  repeated Post posts = 3;
}

message ListBlockedUsersRequest {}

message ListBlockedUsersResponse {
  // 내가 차단한 사람들. 나를 차단한 사람은 여기 없다(그건 내가 알 일이 아니다).
  repeated Author users = 1;
}

message ListRepliesRequest {
  string comment_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}

message ListRepliesResponse {
  repeated Comment comments = 1;
}

message LikeCommentRequest {
  string comment_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message LikeCommentResponse {
  int32 like_count = 1;
  bool liked_by_me = 2;
}

message UnlikeCommentRequest {
  string comment_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message UnlikeCommentResponse {
  int32 like_count = 1;
  bool liked_by_me = 2;
}

service FeedService {
  // 내 피드. 로그인이 필요하다 — "누구를 팔로우하는가"가 있어야 답이 정해진다.
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse) {}

  // 특정 사용자의 글. 보는 사람과의 관계에 따라 공개범위가 걸린다.
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse) {}

  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse) {}

  // 올린 뒤 고칠 수 있는 것은 **캡션과 공개범위뿐**이다 — 운동 기록은 그때의 사실이라 바꾸지 않는다.
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse) {}

  // 자기 글만 지울 수 있다(모더레이터는 별도 경로 — 아직 없다).
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {}

  // 좋아요는 **멱등**이다. 두 번 눌러도 하나다.
  rpc LikePost(LikePostRequest) returns (LikePostResponse) {}
  rpc UnlikePost(UnlikePostRequest) returns (UnlikePostResponse) {}

  // 저장은 **나만 본다** — 좋아요와 달리 글쓴이에게 알려지지 않는다.
  rpc BookmarkPost(BookmarkPostRequest) returns (BookmarkPostResponse) {}
  rpc UnbookmarkPost(UnbookmarkPostRequest) returns (UnbookmarkPostResponse) {}
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse) {}

  // 캡션의 #태그로 모아 보기. 태그는 글을 올릴 때 캡션에서 뽑아 따로 저장한다.
  rpc ListHashtagPosts(ListHashtagPostsRequest) returns (ListHashtagPostsResponse) {}
  rpc TrendingHashtags(TrendingHashtagsRequest) returns (TrendingHashtagsResponse) {}

  // 공개 프로필과 그 사람과의 관계(팔로우·차단).
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {}
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {}
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {}
  rpc ListFollows(ListFollowsRequest) returns (ListFollowsResponse) {}
  // 차단 목록 — 풀려면 여기서 찾아야 하므로 화면이 필요하다.
  rpc ListBlockedUsers(ListBlockedUsersRequest) returns (ListBlockedUsersResponse) {}

  // ── 발견(Explore) ──
  // 팔로우와 무관하게 **공개 글 중 반응이 많은 것**. 피드가 비어 있는 새 사용자의 첫 화면이다.
  rpc ListExplore(ListExploreRequest) returns (ListExploreResponse) {}
  // 팔로우할 만한 사람 — 친구의 친구를 먼저, 모자라면 팔로워가 많은 사람으로 채운다.
  rpc SuggestedUsers(SuggestedUsersRequest) returns (SuggestedUsersResponse) {}
  // 사람·태그·글을 한 번에 찾는다.
  rpc Search(SearchRequest) returns (SearchResponse) {}

  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {}
  // 답글은 **펼칠 때** 가져온다 — 목록에 미리 싣지 않는다.
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse) {}
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse) {}
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse) {}
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {}
  // 댓글은 **쓴 사람과 글 주인**이 지울 수 있다.
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse) {}

  rpc Follow(FollowRequest) returns (FollowResponse) {}
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse) {}

  // 사람 찾기 — 표시 이름·이메일 부분일치.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {}
}
