// @plm SRS-039 @plm SRS-040  착용장비 계약 — 설정 조회와 클릭 집계 (ADR-027)
//
// ─────────────────────────────────────────────────────────────────────────────
// ── 왜 앱이 링크를 만들지 않나 ──────────────────────────────────────────────
// 제휴 딥링크와 활성 스위치는 **서버 설정에만** 둔다. 앱 번들에 넣으면 평문으로 굳어 회수가 불가능하고,
// 링크를 바꾸려면 앱을 다시 배포해야 한다(ADR-027 D2). 그래서 서버는 **완성된 링크만** 내려보내고,
// 파트너 태그·서브아이디 같은 조립 재료는 절대 싣지 않는다.
//
// ── Phase 0은 수수료를 벌지 않는다 ──────────────────────────────────────────
// 지금 단계가 남기는 자산은 **클릭 데이터뿐**이다. 그 수치가 다음 단계(자동 감지·정산) 투자 판단의
// 근거가 된다 — 그래서 집계 RPC가 계약에 있다.
//
// ── 기본값은 꺼짐이다 ───────────────────────────────────────────────────────
// 설정이 없으면 `enabled=false`, 링크도 없다. 미등록 매체에 광고를 노출하면 제재 대상이라,
// **켜려는 의도가 명확할 때만** 켜져야 한다.
// ─────────────────────────────────────────────────────────────────────────────
syntax = "proto3";

package gear.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/JWK-company/liftgram/src/backend/gen/gear/v1;gearv1";

// 8종 고정. 도메인(core의 GEAR_CATEGORIES)과 **같은 목록**이어야 한다 —
// 한쪽에만 있는 카테고리는 링크도 라벨도 없이 화면에 뜬다.
enum GearCategory {
  GEAR_CATEGORY_UNSPECIFIED = 0;
  GEAR_CATEGORY_WRIST_WRAP = 1;
  GEAR_CATEGORY_STRAP = 2;
  GEAR_CATEGORY_BELT = 3;
  GEAR_CATEGORY_KNEE_SLEEVE = 4;
  GEAR_CATEGORY_GLOVES = 5;
  GEAR_CATEGORY_SHOES = 6;
  GEAR_CATEGORY_CHALK = 7;
  GEAR_CATEGORY_ARM_SLEEVE = 8;
}

// 태그의 원천. 지금은 늘 사용자지만, 나중에 자동 감지가 붙어도
// **사용자 지정을 덮어쓰지 못하게** 형식을 지금 심어 둔다(ADR-027 D7).
enum GearSource {
  GEAR_SOURCE_UNSPECIFIED = 0;
  GEAR_SOURCE_USER = 1;
  GEAR_SOURCE_AUTO = 2;
}

// 링크가 딥링크였는지 검색이었는지 — 성과를 나눠 보기 위해 함께 적재한다.
enum LinkKind {
  LINK_KIND_UNSPECIFIED = 0;
  LINK_KIND_DEEPLINK = 1;
  LINK_KIND_SEARCH = 2;
}

// 글에 붙는 착용장비 태그.
message GearTag {
  GearCategory category = 1;
  GearSource source = 2;
  // 사용자가 확인한 브랜드(선택). 검색어에 반영된다.
  string brand = 3 [(buf.validate.field).string = {max_len: 40}];
  // 사용자가 적은 짧은 메모(선택).
  string note = 4 [(buf.validate.field).string = {max_len: 30}];
}

message GetConfigRequest {}

message GetConfigResponse {
  // 딥링크를 써도 되는가. 설정이 없으면 false다.
  bool enabled = 1;
  // 카테고리 → 사전 생성된 딥링크. **서버가 조립하지 않는다** — 사람이 만든 것을 그대로 옮긴다.
  map<string, string> links = 2;
}

message RecordClickRequest {
  string post_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  GearCategory category = 2;
  GearSource source = 3;
  LinkKind kind = 4;
}

message RecordClickResponse {}

service GearService {
  // 화면이 링크를 열기 전에 한 번 읽는다. 실패해도 화면은 검색 링크로 동작한다.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {}
  // 링크를 **연 뒤에** 부른다(막지 않는다). 같은 사람이 같은 글의 같은 장비를
  // 짧은 시간에 여러 번 눌러도 한 번만 쌓인다 — 반복 클릭은 제재 사유이기도 하다.
  rpc RecordClick(RecordClickRequest) returns (RecordClickResponse) {}
}
