// @plm SRS-020  알림 계약 — 누가 나에게 무엇을 했는가
//
// ─────────────────────────────────────────────────────────────────────────────
// 알림은 **부수적**이다. 팔로우·좋아요·댓글이 일어날 때 곁들여 쌓이고,
// 그 쌓기가 실패해도 원래 동작(팔로우 자체)은 성공한다 — 알림 때문에 좋아요가 안 눌리면 안 된다.
//
// 내용을 저장하지 않는다: 종류(follow|like|comment|coaching_summary)와 **누가**·**어느 글**만 남긴다.
// 문구는 화면이 만든다 — 서버는 보는 사람의 언어를 모른다(옛 서버와 같은 판단).
// ─────────────────────────────────────────────────────────────────────────────
syntax = "proto3";

package notification.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/JWK-company/liftgram/src/backend/gen/notification/v1;notificationv1";

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_FOLLOW = 1;
  NOTIFICATION_KIND_LIKE = 2;
  NOTIFICATION_KIND_COMMENT = 3;
  // 회원이 나(트레이너)에게 성과 요약을 보냈다(SRS-080). actor = 회원 · post_id 는 비어 있다 —
  // 화면은 그 회원과의 대화로 간다. 옛 앱은 모르는 종류라 generic 문구로 보인다(S-16).
  // @plm SRS-080
  NOTIFICATION_KIND_COACHING_SUMMARY = 4;
  // 코칭 v2(SPEC-050) — 받는 쪽 = 반대편. post_id 는 비우고 대상은 ref_id 에 싣는다.
  // 요청·수락·해지 = ref_id 는 관계(grant) id → 화면은 /coaching.
  NOTIFICATION_KIND_COACHING_REQUEST = 5;
  NOTIFICATION_KIND_COACHING_ACCEPT = 6;
  NOTIFICATION_KIND_COACHING_REVOKE = 7;
  // 코치가 루틴을 보냈다 / 고쳐 보냈다(10분 묶음) — ref_id 는 회원 쪽 루틴 id.
  NOTIFICATION_KIND_COACHING_ROUTINE = 8;
  NOTIFICATION_KIND_COACHING_ROUTINE_UPDATE = 9;
  // 코치가 운동에 코멘트를 남겼다 — ref_id 는 운동 id(/history/[ref_id]).
  NOTIFICATION_KIND_COACHING_COMMENT = 10;
  // 이달의 리프터 수상(SPEC-063) — ref_id 는 수상 id(/awards/[ref_id]). actor 는 받는 사람 자신이다(운영자 이름을 보이지 않게).
  NOTIFICATION_KIND_AWARD = 11;
  // 그룹 챌린지(SPEC-064) — ref_id 는 챌린지 id(/challenges/[ref_id]). actor 는 받는 사람 자신(이의한 사람·방장을 드러내지 않는다).
  // 21시 미완료 · 빠짐(만회 안내) · 이의로 인증 무효 · 끝(결과) · 취소(시작 때 2명 미만).
  NOTIFICATION_KIND_CHALLENGE_REMIND = 12;
  NOTIFICATION_KIND_CHALLENGE_MISSED = 13;
  NOTIFICATION_KIND_CHALLENGE_PROOF_INVALID = 14;
  NOTIFICATION_KIND_CHALLENGE_ENDED = 15;
  NOTIFICATION_KIND_CHALLENGE_CANCELLED = 16;
}

message Actor {
  string id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

message Notification {
  string id = 1;
  NotificationKind kind = 2;
  Actor actor = 3;
  // like·comment일 때 그 글. 눌러서 찾아가는 자리다.
  string post_id = 4;
  bool read = 5;
  google.protobuf.Timestamp created_at = 6;
  // 코칭 알림의 대상(SPEC-050) — 관계 id·루틴 id·운동 id. 다른 종류는 빈 문자열.
  string ref_id = 7;
}

message ListNotificationsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message UnreadCountRequest {}

message UnreadCountResponse {
  int32 count = 1;
}

message MarkAllReadRequest {}

message MarkAllReadResponse {}

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {}
  // 피드 머리의 배지가 매번 부른다 — 세는 것 하나뿐이라 가볍다.
  rpc UnreadCount(UnreadCountRequest) returns (UnreadCountResponse) {}
  // 알림 화면을 열면 한 번에 읽음 처리한다(개별 읽음은 app에도 없다).
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse) {}
}
