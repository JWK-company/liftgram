# @plm SRS-001  SQL → 타입 안전한 Go 코드 생성 (ADR-011)
#
# 왜 sqlc인가: 이 템플릿의 convention 중 하나가 "repository는 SQL만 안다"인데,
# sqlc는 그 경계를 **코드생성으로 강제한다** — 쿼리는 .sql에만 쓰이고, Go 쪽은 생성물이라
# 규칙이 스며들 자리가 없다. ORM과 달리 실행되는 SQL이 눈에 보이는 것도 그대로 유지된다.
#
# schema를 migrations/ 로 잡은 것이 중요하다: 마이그레이션이 곧 스키마의 single source of truth이고,
# 별도 schema.sql을 두어 둘이 어긋나는 일이 구조적으로 없다.
#
# 실행: make sqlc  (생성물은 커밋한다 — 받는 사람이 도구 없이도 빌드되게)
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlcgen"
        # 생성물은 **Go 모듈 안**에 있어야 컴파일된다 — 사람이 쓰는 SQL만 여기 모은다.
        out: "../backend/internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
