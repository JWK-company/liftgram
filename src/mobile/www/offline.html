  body { margin:0; min-height:100vh; display:grid; place-content:center; gap:16px; padding:24px; background:var(--bg); color:var(--ink);

  h1 { font-size:20px; margin:0 } .logo { width:56px; height:56px; margin:0 auto } p { margin:0; color:var(--muted) }

  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>처음 한 번은 인터넷이 필요해요. 한 번 열고 나면 헬스장에서 인터넷이 없어도 기록할 수 있어요.</p>
  <button type="button" onclick="location.href='https://liftgram.tarae.org/'">다시 시도</button>
<script>
  // 원격 화면을 못 열어 이 파일이 떴다 — 네이티브 스플래시를 내린다(안 내리면 상한 6초까지 스플래시가 가린다 · SPEC-017 Phase 1)
