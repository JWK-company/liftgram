<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리프트그램</title>
<style>
  :root { --bg:#f7f7f7; --ink:#141619; --muted:#565b61; --brand:#C8381C; color-scheme: light dark }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --ink:#f5f7f9; --muted:#a9b2bd; --brand:#FF7A57 } }
  body { margin:0; min-height:100vh; display:grid; place-content:center; gap:16px; padding:24px; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; text-align:center }
  h1 { font-size:20px; margin:0 } p { margin:0; color:var(--muted) }
  button { font:inherit; font-weight:600; padding:12px 20px; border-radius:10px; border:0; background:var(--brand); color:#fff; min-height:44px }
</style>
</head>
<body>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>처음 한 번은 인터넷이 필요해요. 한 번 열고 나면 헬스장에서 인터넷이 없어도 기록할 수 있어요.</p>
  <button type="button" onclick="location.href='https://liftgram.tarae.org/'">다시 시도</button>
</body>
</html>
