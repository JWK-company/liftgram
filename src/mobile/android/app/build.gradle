apply plugin: 'com.android.application'

// SPEC-018  앱 버전의 유일한 원본 = src/mobile/release.json(운영 M-7) · 출시 키 지문 = src/mobile/release-cert.json(보안 M-2 — 앱 안 상수)
def releaseInfo = new groovy.json.JsonSlurper().parse(file('../../release.json'))
def releaseCertFile = file('../../release-cert.json')
def releaseCert = releaseCertFile.exists() ? (new groovy.json.JsonSlurper().parse(releaseCertFile).sha256 ?: "") : ""
// 형식이 틀린 값은 상수에 넣지 않는다(빈 값 = 「모름」 — 문자열 주입 방지 · Phase 1 qa 보안 L-3)
if (!(releaseCert ==~ /^[0-9a-f]{64}$/)) releaseCert = ""
// 출시 빌드에 지문 상수가 비면 업데이트 검사의 근거 하나가 빠진다 → 멈춘다(Phase 1 qa 안드로이드 M-2)
gradle.taskGraph.whenReady { graph ->
    // [원본] ... && it.name.startsWith('assemble') — bundleRelease·installRelease 로는 상수 없이 빌드됐다(P2 보안 L-4)
    if (releaseCert.isEmpty() && graph.allTasks.any { it.path.startsWith(':app:') && it.name.toLowerCase().contains('release') && (it.name.startsWith('assemble') || it.name.startsWith('bundle') || it.name.startsWith('install') || it.name.startsWith('package')) }) {
        throw new GradleException("src/mobile/release-cert.json 의 sha256 이 없거나 형식이 틀렸다 — src/scripts/android-release-key.sh")
    }
}

android {
    namespace = "org.tarae.liftgram"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.tarae.liftgram"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // [원본] versionCode 2
        // [원본] versionName "1.1.0"
        // [개선] SPEC-018 — release.json 에서 읽는다(빌드 스크립트가 aapt2 로 다시 대조)
        versionCode releaseInfo.versionCode as int
        versionName releaseInfo.versionName as String
        buildConfigField "String", "RELEASE_CERT_SHA256", "\"${releaseCert}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // @plm SRS-095 [ADR-046]  출시 서명(업로드 키) — 키와 비밀번호는 **저장소 밖**에 둔다(~/.liftgram-release/upload.properties ·
    // 또는 LIFTGRAM_UPLOAD_KEY_PROPS 경로). 파일이 없으면 서명 없이 빌드된다(디버그·CI 는 그대로).
    // [원본] 앱 서명 키는 구글이 보관한다(Play App Signing) — 이것은 올리는 사람임을 증명하는 업로드 키다(잃으면 Play 에서 재설정 가능).
    // [개선] SPEC-018(보안 M-5 · 안드로이드 H-3) — 자체 배포에서는 이 키가 곧 **앱 서명 키**다. 잃으면 재설정할 길이 없고
    //   모든 사용자가 다시 설치해야 한다(백업 2벌 필수). 출시 APK 는 src/scripts/build-android-release.sh 가 키 없이 빌드한 뒤
    //   apksigner 로 따로 서명한다(의존성 gradle 코드가 키를 못 보게 · 보안 M-4). 아래 설정은 손으로 서명할 때만 쓰인다.
    signingConfigs {
        release {
            // [원본] def propsFile = file(System.getenv("LIFTGRAM_UPLOAD_KEY_PROPS") ?: "${System.getProperty('user.home')}/.liftgram-release/upload.properties")
            // [개선] Phase 1 qa 보안 M-3 — 기본 경로를 읽지 않는다. 손으로 서명할 때만 환경 변수로 명시한다(평소 gradle 실행이 비밀번호를 못 읽게).
            def propsPath = System.getenv("LIFTGRAM_UPLOAD_KEY_PROPS")
            def propsFile = propsPath ? file(propsPath) : null
            if (propsFile != null && propsFile.exists()) {
                def p = new Properties()
                propsFile.withInputStream { p.load(it) }
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            // 빌드에 git 정보를 싣지 않는다 — 같은 소스면 어느 경로·사본에서든 같은 바이트(Phase 1 qa 안드로이드 L-7)
            vcsInfo.include false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // SPEC-018 P2 보안 M-2 — 업데이트 플러그인이 새 브리지(WEB_MESSAGE_LISTENER)인지 본다(Capacitor 와 같은 판)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // 잠금 카드 규칙 JUnit(SPEC-017 Phase 4) — 안드로이드 jar 의 org.json 은 JVM 테스트에서 비어 있다(stub) → 실제 구현을 테스트에만
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
